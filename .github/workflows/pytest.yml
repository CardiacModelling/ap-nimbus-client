name: build
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      ldap:
        image: osixia/openldap:1.5.0
        env:
          LDAP_ORGANISATION: Example Inc.
          LDAP_DOMAIN: example.com
          LDAP_ADMIN_PASSWORD: admin
        ports:
          - 1389:389
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - name: Start PostgreSQL on Ubuntu
      run: |
        sudo systemctl start postgresql.service
        pg_isready
    - name: Create client user
      run: |
        sudo -u postgres psql --command="CREATE USER client PASSWORD 'not-so-secret django db password'" --command="\du"
        sudo -u postgres psql --command="ALTER USER client CREATEDB;" --command="\du"
    - name: Edit git settings
      run: |
        git config --global user.email "github.actions@CI.com"  
        git config --global user.name "Github Actions"
    - name: Checkout repository and submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libldap2-dev libsasl2-dev libmagic1 ldap-utils
        python3 -m pip install --upgrade pip wheel
        python3 -m pip install flake8 pytest pytest-django
        python3 -m pip install -r requirements/requirements.txt
        python3 -m pip install -r requirements/dev.txt
    - name: Seed LDAP test directory
      run: |
        for i in {1..20}; do
          if ldapwhoami -x -H ldap://localhost:1389 -D "cn=admin,dc=example,dc=com" -w admin; then
            break
          fi
          sleep 2
        done

        ldapadd -x -H ldap://localhost:1389 -D "cn=admin,dc=example,dc=com" -w admin -f ci/ldap-seed.ldif

        ldapsearch -x -H ldap://localhost:1389 -D "cn=admin,dc=example,dc=com" -w admin -b "ou=mathematicians,dc=example,dc=com" "(uid=ldapuser)"
    - name: List installed dependency versions
      run: |
        python3 -m pip list
    - name: Lint with flake8
      run: |
        python3 -m flake8 client
    - name: Test sorting with isort
      run: |
        python3 -m isort --verbose --check-only client
    - name: Test with pytest
      run: |
        python3 -m pytest --cov=client --cov-config=client/.coveragerc --cov-report term-missing client
      env:
        DJANGO_SUPERUSER_EMAIL: django@test.com
        PGDATABASE: django
        PGUSER: client
        PGPASSWORD: not-so-secret django db password
        PGHOST: localhost
        PGPORT: 5432
        DJANGO_SECRET_KEY: 'django very secret key, honest'

    - uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
