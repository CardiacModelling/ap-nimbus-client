# clientdirect_uwsgi.ini file
[uwsgi]
#project = ap-nimbus-client
# Run workers as the non-root app user (starts as root via sudo, then drops to this uid).
uid = appredict

# Django-related settings
# the base directory (full path)
chdir           = /opt/django/ap-nimbus-client/client

# Django's wsgi file
module          = config.wsgi
# the virtualenv (full path)
virtualenv      = /opt/venv

# process-related settings
# master
master          = true

# maximum number of worker processes
processes       = 10

# the socket (use the full path to be safe
socket          = /run/client.sock
pidfile2        = /run/client.pid

# ... with appropriate permissions - may be needed
chown-socket = %(uid):www-data
chmod-socket    = 660

# Workers are non-root so they can't clear the /run socket/pidfile on exit.
# Root unlinks/overwrites them on the next start.
vacuum          = false

enable-threads  = true

logto2          = /opt/django/media/uwsgi.log
# chown the log so the non-root app user can read it directly (no sudo)
logfile-chown   = true
